<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karicool</title>
<meta name="description" content="Calendrier et composeur de publications Instagram et LinkedIn de Karim.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bleu-nuit: #0B3A8C;
    --bleu-karicool: #1A5FD6;
    --bleu-ciel: #1E8FE8;
    --nuage: #F3F7FD;
    --bordure: #DCE5F3;
    --texte: #10224A;
    --texte-secondaire: #3B4B6E;
    --texte-mute: #5A6B8C;
    --fond: #FFFFFF;
    --carte: #FFFFFF;

    --menthe-bg: #E3F7EC; --menthe-fg: #146B43; --menthe: #5FD39A;
    --turquoise-bg: #DDF5F5; --turquoise-fg: #0B6B6C; --turquoise: #14BFC0;
    --soleil-bg: #FEF2D6; --soleil-fg: #8A5A00; --soleil: #FBB935;
    --erreur-bg: #FDE7E2; --erreur-fg: #8A2E1C; --erreur: #E8573F;
    --insta-bg: #EFE9FE; --insta-fg: #5B3FC4;
    --linkedin-bg: #E4EDFB; --linkedin-fg: #0B3A8C;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--nuage); color: var(--texte); font-family: 'DM Sans', sans-serif; font-size: 15px; }
  h1, h2, h3, .nunito { font-family: 'Nunito', sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }

  .topbar {
    background: var(--fond); border-bottom: 1px solid var(--bordure);
    padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: 0; z-index: 10;
  }
  .wordmark { font-weight: 900; font-size: 22px; color: var(--bleu-nuit); margin: 0; }
  .wordmark span { color: var(--menthe); }
  .tabs { display: flex; gap: 6px; }
  .tab-btn {
    border: 1px solid var(--bordure); background: var(--fond); color: var(--texte-secondaire);
    padding: 8px 16px; border-radius: 12px; font-weight: 700; font-size: 13.5px;
  }
  .tab-btn.active { background: var(--bleu-karicool); color: #fff; border-color: var(--bleu-karicool); }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  .btn { border-radius: 12px; padding: 10px 18px; font-weight: 800; font-size: 13.5px; border: none; }
  .btn-primary { background: var(--bleu-karicool); color: #fff; }
  .btn-primary:hover { background: var(--bleu-nuit); }
  .btn-secondary { background: #fff; color: var(--bleu-karicool); border: 1px solid var(--bleu-karicool); }
  .btn-tertiary { background: transparent; color: var(--bleu-karicool); border: none; font-weight: 700; }
  .btn-danger { background: #fff; color: var(--erreur-fg); border: 1px solid var(--erreur); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .icon-btn { background: transparent; border: none; color: var(--texte-mute); font-size: 18px; padding: 4px 8px; border-radius: 8px; }
  .icon-btn:hover { background: var(--nuage); }

  main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .badge-posted { background: var(--menthe-bg); color: var(--menthe-fg); }
  .badge-pending { background: var(--turquoise-bg); color: var(--turquoise-fg); }
  .badge-draft { background: var(--soleil-bg); color: var(--soleil-fg); }
  .badge-error { background: var(--erreur-bg); color: var(--erreur-fg); }
  .badge-instagram { background: var(--insta-bg); color: var(--insta-fg); }
  .badge-linkedin { background: var(--linkedin-bg); color: var(--linkedin-fg); }

  /* Calendar */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-header h2 { margin: 0; font-size: 20px; font-weight: 800; color: var(--bleu-nuit); text-transform: capitalize; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: var(--texte-mute); text-transform: uppercase; padding-bottom: 4px; }
  .cal-day {
    background: var(--fond); border: 1px solid var(--bordure); border-radius: 12px; min-height: 92px;
    padding: 6px; display: flex; flex-direction: column; gap: 4px; cursor: pointer;
  }
  .cal-day:hover { border-color: var(--bleu-ciel); }
  .cal-day.muted { opacity: 0.4; }
  .cal-day.today { border-color: var(--bleu-karicool); border-width: 2px; }
  .cal-daynum { font-size: 12px; font-weight: 700; color: var(--texte-secondaire); }
  .cal-post { font-size: 10.5px; padding: 2px 6px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  .cal-post.posted { background: var(--menthe-bg); color: var(--menthe-fg); }
  .cal-post.pending { background: var(--turquoise-bg); color: var(--turquoise-fg); }
  .cal-post.draft { background: var(--soleil-bg); color: var(--soleil-fg); }
  .cal-post.error { background: var(--erreur-bg); color: var(--erreur-fg); }
  .cal-more { font-size: 10px; color: var(--texte-mute); }

  /* List */
  .list-filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--bordure); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 12.5px; font-weight: 700; color: var(--texte-secondaire); }
  .chip.active { background: var(--bleu-nuit); color: #fff; border-color: var(--bleu-nuit); }
  .post-card {
    background: var(--carte); border: 1px solid var(--bordure); border-radius: 16px; padding: 16px 18px;
    display: flex; gap: 14px; align-items: flex-start; margin-bottom: 10px; cursor: pointer; box-shadow: 0 2px 8px rgba(11,58,140,0.04);
  }
  .post-card:hover { border-color: var(--bleu-ciel); }
  .post-thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--nuage); flex-shrink: 0; }
  .post-body { flex: 1; min-width: 0; }
  .post-top { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .post-date { font-size: 12px; color: var(--texte-mute); font-weight: 700; }
  .post-caption { font-size: 13.5px; color: var(--texte-secondaire); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .post-metrics { display: flex; gap: 10px; margin-top: 8px; font-size: 11.5px; color: var(--texte-mute); flex-wrap: wrap; }
  .empty { text-align: center; padding: 60px 20px; color: var(--texte-mute); }

  /* Sélection groupée */
  .bulk-bar { display: flex; align-items: center; gap: 14px; background: var(--fond); border: 1px solid var(--bordure); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; color: var(--texte-secondaire); font-weight: 700; flex-wrap: wrap; }
  .bulk-bar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .bulk-bar #bulk-count { margin-left: auto; color: var(--texte-mute); font-weight: 700; }
  .post-check { width: 16px; height: 16px; margin-top: 4px; flex-shrink: 0; }

  /* Insights */
  .insight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .insight-card { background: var(--carte); border: 1px solid var(--bordure); border-radius: 16px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(11,58,140,0.04); }
  .insight-value { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 26px; color: var(--bleu-nuit); }
  .insight-label { font-size: 12px; color: var(--texte-mute); font-weight: 700; margin-top: 4px; }
  .insight-section-title { margin: 28px 0 12px; font-size: 18px; font-weight: 800; color: var(--bleu-nuit); }

  /* Modal / composer */
  .overlay { position: fixed; inset: 0; background: rgba(11,58,140,0.35); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 100; }
  .modal { background: var(--fond); border-radius: 20px; max-width: 560px; width: 100%; padding: 28px; box-shadow: 0 20px 60px rgba(11,58,140,0.25); }
  .modal h2 { margin: 0 0 18px; font-size: 20px; font-weight: 800; color: var(--bleu-nuit); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--texte-secondaire); margin-bottom: 6px; }
  .field input[type=text], .field input[type=date], .field input[type=time], .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--bordure); border-radius: 10px; background: #fff; color: var(--texte);
  }
  .field textarea { min-height: 90px; resize: vertical; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }
  .platform-toggle { display: flex; gap: 8px; }
  .platform-toggle button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--bordure); background: #fff; font-weight: 700; color: var(--texte-secondaire); }
  .platform-toggle button.active.instagram { background: var(--insta-bg); color: var(--insta-fg); border-color: var(--insta-fg); }
  .platform-toggle button.active.linkedin { background: var(--linkedin-bg); color: var(--linkedin-fg); border-color: var(--linkedin-fg); }
  .file-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .file-preview-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .file-preview-item img, .file-preview-item video { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--bordure); }
  .file-preview-controls { display: flex; gap: 3px; }
  .file-preview-move, .file-preview-remove {
    border: 1px solid var(--bordure); background: #fff; border-radius: 6px; font-size: 11px; line-height: 1;
    padding: 3px 6px; color: var(--texte-secondaire);
  }
  .file-preview-remove { color: var(--erreur-fg); border-color: var(--erreur); }
  .hint { font-size: 12px; color: var(--texte-mute); margin-top: 4px; }
  .current-media-preview { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 10px; -webkit-overflow-scrolling: touch; }
  .current-media-preview img, .current-media-preview video {
    height: 180px; width: auto; max-width: 260px; flex-shrink: 0;
    border-radius: 12px; border: 1px solid var(--bordure); object-fit: cover; background: var(--nuage);
  }
  .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 22px; }
  .modal-actions-right { display: flex; gap: 8px; }
  .readonly-info { background: var(--nuage); border-radius: 12px; padding: 14px 16px; font-size: 13.5px; color: var(--texte-secondaire); margin-bottom: 14px; white-space: pre-wrap; }
  .status-msg { font-size: 12.5px; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; }
  .status-msg.ok { background: var(--menthe-bg); color: var(--menthe-fg); }
  .status-msg.err { background: var(--erreur-bg); color: var(--erreur-fg); }
  .status-msg.busy { background: var(--nuage); color: var(--texte-mute); }

  .gate { max-width: 440px; margin: 80px auto; background: var(--fond); border: 1px solid var(--bordure); border-radius: 20px; padding: 32px; text-align: center; }
  .gate h1 { font-size: 26px; font-weight: 900; color: var(--bleu-nuit); margin: 0 0 6px; }
  .gate h1 span { color: var(--menthe); }
  .gate p { color: var(--texte-secondaire); font-size: 14px; line-height: 1.6; }
  .gate input { width: 100%; padding: 12px; border: 1px solid var(--bordure); border-radius: 10px; margin: 14px 0; text-align: center; }

  @media (max-width: 640px) {
    .cal-grid { grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-day { min-height: 64px; padding: 4px; }
    .cal-post { font-size: 9px; }
    .topbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <h1>Kari<span>cool</span></h1>
  <p>Colle ton jeton d'accès GitHub (PAT) pour ouvrir le calendrier. Il est stocké uniquement dans ce navigateur, jamais envoyé ailleurs qu'à l'API GitHub.</p>
  <input type="text" id="gate-pat" placeholder="github_pat_...">
  <button class="btn btn-primary" id="gate-save" style="width:100%">Ouvrir Karicool</button>
  <p class="hint" id="gate-error" style="color:var(--erreur-fg)"></p>
</div>

<div id="app" hidden>
  <div class="topbar">
    <h1 class="wordmark">Kari<span>cool</span></h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="calendar">Calendrier</button>
      <button class="tab-btn" data-tab="list">Liste</button>
      <button class="tab-btn" data-tab="insights">Insights</button>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-refresh" title="Recharger">⟳</button>
      <button class="btn btn-primary" id="btn-new">+ Nouveau post</button>
      <button class="icon-btn" id="btn-settings" title="Changer de jeton">⚙</button>
    </div>
  </div>

  <main>
    <div id="status-bar"></div>
    <div id="view-calendar"></div>
    <div id="view-list" hidden></div>
    <div id="view-insights" hidden></div>
  </main>
</div>

<div id="modal-root"></div>

<script>
(function() {
  "use strict";

  const OWNER = "karicool";
  const REPO_SCHEDULE = "karicool";
  const REPO_MEDIA = "karicool-media";
  const API = "https://api.github.com";
  const RAW_BASE = `https://raw.githubusercontent.com/${OWNER}/${REPO_MEDIA}/main`;

  const STATUS_LABEL = { draft: "Brouillon", pending: "Programmé", posted: "Publié", error: "Erreur" };
  const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const JOURS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];

  let PAT = null;
  let posts = [];
  let scheduleSha = null;
  let currentTab = "calendar";
  let calMonth = new Date();
  let listFilter = { status: "all", platform: "all" };
  let editingId = null; // post being edited, or "__new__"
  let selectedIds = new Set(); // sélection groupée dans la vue Liste (brouillons uniquement)

  // ---------- utils ----------
  function utf8ToB64(str) { return btoa(unescape(encodeURIComponent(str))); }
  function b64ToUtf8(str) { return decodeURIComponent(escape(atob(str.replace(/\n/g, "")))); }
  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(c => { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  const REF_TZ = "Europe/Paris"; // heure de référence : celle de la publication (France), pas celle de Karim (Tokyo)

  function fmtDateRef(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleString("fr-FR", { timeZone: REF_TZ, day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) + " (Paris)";
  }
  function localInputsFromIso(iso) {
    if (!iso) return { date: "", time: "" };
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: REF_TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(new Date(iso));
    const get = t => parts.find(p => p.type === t).value;
    return { date: `${get("year")}-${get("month")}-${get("day")}`, time: `${get("hour")}:${get("minute")}` };
  }
  function parisInputsToIso(date, time) {
    if (!date || !time) return null;
    // Construit un instant en heure de Paris (CET/CEST, DST géré) et le convertit en UTC.
    // Méthode : on part d'une estimation, on regarde quelle heure murale elle donne à Paris,
    // puis on corrige l'écart. Deux passes suffisent même autour d'un changement d'heure.
    const [y, m, d] = date.split("-").map(Number);
    const [hh, mm] = time.split(":").map(Number);
    const wantMs = Date.UTC(y, m - 1, d, hh, mm, 0);
    let guessMs = wantMs;
    for (let i = 0; i < 2; i++) {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: REF_TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      }).formatToParts(new Date(guessMs));
      const get = t => parseInt(parts.find(p => p.type === t).value, 10);
      const hour24 = get("hour") === 24 ? 0 : get("hour");
      const gotMs = Date.UTC(get("year"), get("month") - 1, get("day"), hour24, get("minute"), get("second"));
      guessMs += (wantMs - gotMs);
    }
    return new Date(guessMs).toISOString().replace(/\.\d{3}Z$/, "Z");
  }
  function ghHeaders(extra) {
    return Object.assign({ "Authorization": `Bearer ${PAT}`, "Accept": "application/vnd.github+json" }, extra || {});
  }
  function setStatus(msg, kind) {
    const bar = document.getElementById("status-bar");
    if (!msg) { bar.innerHTML = ""; return; }
    bar.innerHTML = "";
    bar.appendChild(el("div", { class: `status-msg ${kind || "busy"}` }, [msg]));
  }

  // ---------- GitHub data ----------
  async function loadSchedule() {
    setStatus("Chargement de schedule.json…", "busy");
    const r = await fetch(`${API}/repos/${OWNER}/${REPO_SCHEDULE}/contents/schedule.json`, { headers: ghHeaders() });
    if (!r.ok) throw new Error(`Impossible de lire schedule.json (${r.status})`);
    const j = await r.json();
    scheduleSha = j.sha;
    const content = b64ToUtf8(j.content).trim();
    posts = content ? JSON.parse(content) : [];
    setStatus("");
  }

  // Recharge toujours schedule.json juste avant d'écrire, applique la modification
  // demandée (mutator) sur cette version fraîche, puis enregistre. Le robot de
  // publication (publish.py) réécrit schedule.json toutes les 30 minutes : sans ça,
  // une modification depuis l'interface pourrait entrer en conflit (409, sha périmé)
  // et écraser silencieusement les changements du robot ou échouer avec un message
  // peu clair. En cas de conflit malgré tout (fenêtre de course), on retente une fois.
  async function commitScheduleChange(mutator, message) {
    setStatus("Enregistrement…", "busy");
    for (let attempt = 0; attempt < 2; attempt++) {
      const r0 = await fetch(`${API}/repos/${OWNER}/${REPO_SCHEDULE}/contents/schedule.json`, { headers: ghHeaders() });
      if (!r0.ok) { setStatus(`Impossible de relire schedule.json (${r0.status})`, "err"); throw new Error("reload failed"); }
      const j0 = await r0.json();
      const freshSha = j0.sha;
      const freshPosts = JSON.parse(b64ToUtf8(j0.content).trim() || "[]");
      const newPosts = mutator(freshPosts);

      const body = {
        message: message || "Mise à jour depuis l'interface Karicool",
        content: utf8ToB64(JSON.stringify(newPosts, null, 2) + "\n"),
        sha: freshSha,
        branch: "main",
      };
      const r = await fetch(`${API}/repos/${OWNER}/${REPO_SCHEDULE}/contents/schedule.json`, {
        method: "PUT", headers: ghHeaders({ "Content-Type": "application/json" }), body: JSON.stringify(body),
      });
      const j = await r.json();
      if (r.ok) {
        posts = newPosts;
        scheduleSha = j.content.sha;
        setStatus("Enregistré.", "ok");
        setTimeout(() => setStatus(""), 2500);
        return;
      }
      if (r.status === 409 && attempt === 0) {
        setStatus("Le fichier a été modifié entretemps (sûrement par la publication automatique) — nouvelle tentative…", "busy");
        continue;
      }
      setStatus(`Échec de l'enregistrement : ${j.message || r.status}`, "err");
      throw new Error(j.message || "save failed");
    }
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.slice(reader.result.indexOf(",") + 1));
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadMedia(file, folder) {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = `${folder}/${Date.now()}_${safeName}`;
    const content = await fileToBase64(file);
    const r = await fetch(`${API}/repos/${OWNER}/${REPO_MEDIA}/contents/${encodeURIComponent(path)}`, {
      method: "PUT", headers: ghHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ message: `upload depuis l'interface: ${safeName}`, content, branch: "main" }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(`Échec upload ${file.name} : ${j.message || r.status}`);
    return `${RAW_BASE}/${path}`;
  }

  // ---------- rendering: calendar ----------
  function postsByDay() {
    const map = {};
    posts.forEach(p => {
      if (!p.scheduled_time) return;
      const local = new Intl.DateTimeFormat("en-CA", { timeZone: REF_TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(p.scheduled_time));
      (map[local] = map[local] || []).push(p);
    });
    return map;
  }

  function renderCalendar() {
    const root = document.getElementById("view-calendar");
    root.innerHTML = "";
    const year = calMonth.getFullYear(), month = calMonth.getMonth();
    const header = el("div", { class: "cal-header" }, [
      el("h2", {}, [`${MOIS[month]} ${year}`]),
      el("div", { class: "cal-nav" }, [
        el("button", { class: "btn btn-secondary", onclick: () => { calMonth = new Date(year, month - 1, 1); renderCalendar(); } }, ["←"]),
        el("button", { class: "btn btn-secondary", onclick: () => { calMonth = new Date(); renderCalendar(); } }, ["Aujourd'hui"]),
        el("button", { class: "btn btn-secondary", onclick: () => { calMonth = new Date(year, month + 1, 1); renderCalendar(); } }, ["→"]),
      ]),
    ]);
    root.appendChild(header);

    const grid = el("div", { class: "cal-grid" });
    JOURS.forEach(j => grid.appendChild(el("div", { class: "cal-dow" }, [j])));

    const firstOfMonth = new Date(year, month, 1);
    const startOffset = (firstOfMonth.getDay() + 6) % 7; // lundi = 0
    const gridStart = new Date(year, month, 1 - startOffset);
    const byDay = postsByDay();
    const todayKey = new Intl.DateTimeFormat("en-CA", { timeZone: REF_TZ }).format(new Date());

    for (let i = 0; i < 42; i++) {
      const day = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      const key = new Intl.DateTimeFormat("en-CA").format(day);
      const inMonth = day.getMonth() === month;
      const dayPosts = (byDay[key] || []).sort((a,b) => a.scheduled_time.localeCompare(b.scheduled_time));
      const cell = el("div", { class: `cal-day${inMonth ? "" : " muted"}${key === todayKey ? " today" : ""}`, onclick: () => openComposer(null, key) });
      cell.appendChild(el("div", { class: "cal-daynum" }, [String(day.getDate())]));
      dayPosts.slice(0, 3).forEach(p => {
        const label = `${p.platform === "instagram" ? "📸" : "💼"} ${(p.caption || "").slice(0, 18)}`;
        cell.appendChild(el("div", { class: `cal-post ${p.status}`, onclick: (e) => { e.stopPropagation(); openComposer(p.id); } }, [label]));
      });
      if (dayPosts.length > 3) cell.appendChild(el("div", { class: "cal-more" }, [`+${dayPosts.length - 3} autre(s)`]));
      grid.appendChild(cell);
    }
    root.appendChild(grid);
  }

  // ---------- rendering: list ----------
  function renderList() {
    const root = document.getElementById("view-list");
    root.innerHTML = "";
    root.appendChild(el("div", { class: "list-filters" }, [
      ...["all","draft","pending","posted","error"].map(s =>
        el("button", { class: `chip${listFilter.status === s ? " active" : ""}`, onclick: () => { listFilter.status = s; selectedIds.clear(); renderList(); } },
          [s === "all" ? "Tous les statuts" : STATUS_LABEL[s]])
      ),
      ...["all","instagram","linkedin"].map(pf =>
        el("button", { class: `chip${listFilter.platform === pf ? " active" : ""}`, onclick: () => { listFilter.platform = pf; selectedIds.clear(); renderList(); } },
          [pf === "all" ? "Tous les réseaux" : (pf === "instagram" ? "Instagram" : "LinkedIn")])
      ),
    ]));

    let filtered = posts.filter(p =>
      (listFilter.status === "all" || p.status === listFilter.status) &&
      (listFilter.platform === "all" || p.platform === listFilter.platform)
    );
    filtered = filtered.slice().sort((a,b) => (b.scheduled_time || "").localeCompare(a.scheduled_time || ""));

    // La sélection groupée ne porte que sur les brouillons actuellement affichés par les filtres.
    const draftIdsVisible = filtered.filter(p => p.status === "draft").map(p => p.id);
    Array.from(selectedIds).forEach(id => { if (!draftIdsVisible.includes(id)) selectedIds.delete(id); });

    if (draftIdsVisible.length > 0) {
      const allSelected = draftIdsVisible.every(id => selectedIds.has(id));
      const selectAllCb = el("input", { type: "checkbox" });
      selectAllCb.checked = allSelected;
      selectAllCb.addEventListener("change", () => {
        if (selectAllCb.checked) draftIdsVisible.forEach(id => selectedIds.add(id));
        else draftIdsVisible.forEach(id => selectedIds.delete(id));
        renderList();
      });
      const bulkValidateBtn = el("button", { class: "btn btn-primary", id: "bulk-validate", onclick: bulkValidateSelected }, ["Passer en programmé"]);
      bulkValidateBtn.disabled = selectedIds.size === 0;
      root.appendChild(el("div", { class: "bulk-bar" }, [
        el("label", {}, [selectAllCb, `Sélectionner tous les brouillons affichés (${draftIdsVisible.length})`]),
        el("span", { id: "bulk-count" }, [selectedIds.size ? `${selectedIds.size} sélectionné(s)` : ""]),
        bulkValidateBtn,
      ]));
    }

    if (filtered.length === 0) { root.appendChild(el("div", { class: "empty" }, ["Aucun post ne correspond à ces filtres."])); return; }

    filtered.forEach(p => {
      const thumbUrl = p.image_url || (p.image_urls && p.image_urls[0]) || null;
      let checkboxOrSpacer;
      if (p.status === "draft") {
        const cb = el("input", { type: "checkbox", class: "post-check", onclick: (e) => {
          e.stopPropagation();
          if (e.target.checked) selectedIds.add(p.id); else selectedIds.delete(p.id);
          updateBulkBar();
        } });
        cb.checked = selectedIds.has(p.id);
        checkboxOrSpacer = cb;
      } else {
        checkboxOrSpacer = el("span", { class: "post-check" });
      }
      const card = el("div", { class: "post-card", onclick: () => openComposer(p.id) }, [
        checkboxOrSpacer,
        thumbUrl ? el("img", { class: "post-thumb", src: thumbUrl }) : el("div", { class: "post-thumb" }),
        el("div", { class: "post-body" }, [
          el("div", { class: "post-top" }, [
            el("span", { class: `badge badge-${p.platform}` }, [p.platform === "instagram" ? "Instagram" : "LinkedIn"]),
            el("span", { class: `badge badge-${p.status}` }, [STATUS_LABEL[p.status] || p.status]),
            el("span", { class: "post-date" }, [fmtDateRef(p.scheduled_time)]),
          ]),
          el("div", { class: "post-caption" }, [p.caption || "(sans légende)"]),
          p.metrics ? el("div", { class: "post-metrics" }, Object.entries(p.metrics).map(([k,v]) => el("span", {}, [`${k}: ${v}`]))) : null,
        ]),
      ]);
      root.appendChild(card);
    });
  }

  function updateBulkBar() {
    const count = document.getElementById("bulk-count");
    const btn = document.getElementById("bulk-validate");
    if (count) count.textContent = selectedIds.size ? `${selectedIds.size} sélectionné(s)` : "";
    if (btn) btn.disabled = selectedIds.size === 0;
  }

  // Fait passer les brouillons sélectionnés en "programmé" (pending), en gardant leur
  // date déjà fixée. Ignore (et signale) tout post sans date, ou tout post Instagram
  // sans visuel — mêmes garde-fous que dans le composeur, pour ne jamais créer un
  // "programmé" invalide en masse.
  async function bulkValidateSelected() {
    const ids = Array.from(selectedIds);
    if (ids.length === 0) return;
    let skipped = [];
    try {
      await commitScheduleChange(fresh => {
        skipped = [];
        return fresh.map(p => {
          if (!ids.includes(p.id) || p.status !== "draft") return p;
          if (!p.scheduled_time) { skipped.push(p.id); return p; }
          const hasMedia = !!(p.image_url || (p.image_urls && p.image_urls.length) || p.video_url);
          if (p.platform === "instagram" && !hasMedia) { skipped.push(p.id); return p; }
          return Object.assign({}, p, { status: "pending" });
        });
      }, `validation groupée: ${ids.length} post(s)`);
      selectedIds.clear();
      if (skipped.length) {
        setStatus(`${ids.length - skipped.length} post(s) passé(s) en programmé. ${skipped.length} ignoré(s) (date ou visuel manquant).`, "err");
      }
      renderList();
    } catch (e) {
      setStatus(String(e.message || e), "err");
    }
  }

  // ---------- rendering: insights ----------
  function instaPostedWithMetrics() {
    return posts.filter(p => p.platform === "instagram" && p.status === "posted" && p.metrics && typeof p.metrics === "object");
  }
  function metricScore(p) {
    const m = p.metrics || {};
    if (typeof m.total_interactions === "number") return m.total_interactions;
    if (typeof m.reach === "number") return m.reach;
    return (Number(m.likes) || 0) + (Number(m.comments) || 0);
  }
  function dayHourOf(iso) {
    const d = new Date(iso);
    const parts = new Intl.DateTimeFormat("fr-FR", { timeZone: REF_TZ, weekday: "long", hour: "2-digit", hour12: false }).formatToParts(d);
    const weekday = parts.find(p => p.type === "weekday").value;
    let hour = parseInt(parts.find(p => p.type === "hour").value, 10);
    if (hour === 24) hour = 0;
    return { weekday, hour };
  }
  function bestMoment(list) {
    if (list.length < 3) return null;
    const byDay = {}, byHour = {};
    list.forEach(p => {
      const iso = p.posted_at || p.scheduled_time;
      if (!iso) return;
      const { weekday, hour } = dayHourOf(iso);
      const score = metricScore(p);
      (byDay[weekday] = byDay[weekday] || []).push(score);
      (byHour[hour] = byHour[hour] || []).push(score);
    });
    const avg = arr => arr.reduce((a,b) => a + b, 0) / arr.length;
    const bestOf = obj => Object.entries(obj).map(([k,v]) => [k, avg(v), v.length]).sort((a,b) => b[1] - a[1])[0];
    const bd = bestOf(byDay), bh = bestOf(byHour);
    if (!bd || !bh) return null;
    return { day: bd, hour: bh };
  }

  function renderInsights() {
    const root = document.getElementById("view-insights");
    root.innerHTML = "";
    root.appendChild(el("h2", { style: "margin:0 0 4px;font-size:20px;font-weight:800;color:var(--bleu-nuit)" }, ["Insights Instagram"]));
    root.appendChild(el("p", { class: "hint", style: "margin-bottom:20px" }, ["Basé sur schedule.json (posts publiés récents). Les posts archivés après 60 jours ne sont pas comptés ici."]));

    const list = instaPostedWithMetrics();
    if (list.length === 0) {
      root.appendChild(el("div", { class: "empty" }, ["Aucun post Instagram publié avec statistiques pour l'instant. Les stats se remplissent automatiquement, une fois par jour, une fois qu'un post est publié."]));
      return;
    }

    const sum = key => list.reduce((a,p) => a + (Number(p.metrics[key]) || 0), 0);
    const nReach = list.filter(p => typeof p.metrics.reach === "number").length;
    const totalReach = sum("reach");

    const cards = [
      ["Posts publiés (avec stats)", String(list.length)],
      ["Reach total", totalReach.toLocaleString("fr-FR")],
      ["Reach moyen / post", nReach ? Math.round(totalReach / nReach).toLocaleString("fr-FR") : "—"],
      ["Likes moyens / post", Math.round(sum("likes") / list.length).toLocaleString("fr-FR")],
      ["Commentaires moyens / post", (sum("comments") / list.length).toFixed(1)],
      ["Enregistrements moyens / post", Math.round(sum("saved") / list.length).toLocaleString("fr-FR")],
      ["Partages moyens / post", Math.round(sum("shares") / list.length).toLocaleString("fr-FR")],
    ];
    root.appendChild(el("div", { class: "insight-grid" }, cards.map(([label, value]) =>
      el("div", { class: "insight-card" }, [
        el("div", { class: "insight-value" }, [value]),
        el("div", { class: "insight-label" }, [label]),
      ])
    )));

    root.appendChild(el("div", { class: "insight-section-title" }, ["Meilleur moment pour publier"]));
    const moment = bestMoment(list);
    if (moment) {
      root.appendChild(el("div", { class: "readonly-info" }, [
        `D'après ${list.length} post(s) publié(s) avec statistiques : le jour le plus efficace en moyenne semble être le ${moment.day[0]} (${Math.round(moment.day[1]).toLocaleString("fr-FR")} interactions en moyenne, sur ${moment.day[2]} post(s)), et l'heure la plus efficace autour de ${moment.hour[0]}h, heure de Paris (${Math.round(moment.hour[1]).toLocaleString("fr-FR")} en moyenne, sur ${moment.hour[2]} post(s)).\n\nÀ prendre comme une observation provisoire tant que l'historique est court — ça se précisera avec plus de posts.`
      ]));
    } else {
      root.appendChild(el("div", { class: "readonly-info" }, [
        "Pas encore assez de posts publiés avec statistiques (minimum 3) pour dégager une tendance fiable. Reviens quand tu auras plus d'historique."
      ]));
    }

    root.appendChild(el("div", { class: "insight-section-title" }, ["Meilleurs posts"]));
    const top = list.slice().sort((a,b) => metricScore(b) - metricScore(a)).slice(0, 5);
    top.forEach(p => {
      const thumbUrl = p.image_url || (p.image_urls && p.image_urls[0]) || null;
      root.appendChild(el("div", { class: "post-card", onclick: () => openComposer(p.id) }, [
        thumbUrl ? el("img", { class: "post-thumb", src: thumbUrl }) : el("div", { class: "post-thumb" }),
        el("div", { class: "post-body" }, [
          el("div", { class: "post-top" }, [
            el("span", { class: "post-date" }, [fmtDateRef(p.posted_at)]),
          ]),
          el("div", { class: "post-caption" }, [p.caption || "(sans légende)"]),
          el("div", { class: "post-metrics" }, Object.entries(p.metrics).map(([k,v]) => el("span", {}, [`${k}: ${v}`]))),
        ]),
      ]));
    });
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
    document.getElementById("view-calendar").hidden = tab !== "calendar";
    document.getElementById("view-list").hidden = tab !== "list";
    document.getElementById("view-insights").hidden = tab !== "insights";
    selectedIds.clear();
    if (tab === "calendar") renderCalendar();
    else if (tab === "list") renderList();
    else renderInsights();
  }

  // ---------- composer ----------
  function closeComposer() { document.getElementById("modal-root").innerHTML = ""; editingId = null; }

  function openComposer(id, prefillDateKey) {
    editingId = id || "__new__";
    const existing = id ? posts.find(p => p.id === id) : null;
    const root = document.getElementById("modal-root");
    root.innerHTML = "";

    if (existing && existing.status === "posted") {
      const metricsTxt = existing.metrics
        ? Object.entries(existing.metrics).map(([k,v]) => `${k} : ${v}`).join("\n") + (existing.metrics_updated_at ? `\n\n(màj ${fmtDateRef(existing.metrics_updated_at)})` : "")
        : "Pas encore de statistiques (mises à jour une fois par jour).";
      const modal = el("div", { class: "modal" }, [
        el("h2", {}, ["Post publié"]),
        el("div", { class: "readonly-info" }, [`${existing.caption || ""}\n\nPublié le ${fmtDateRef(existing.posted_at)}\n\n${metricsTxt}`]),
        el("div", { class: "modal-actions" }, [
          el("span"),
          el("button", { class: "btn btn-secondary", onclick: closeComposer }, ["Fermer"]),
        ]),
      ]);
      root.appendChild(el("div", { class: "overlay", onclick: (e) => { if (e.target === e.currentTarget) closeComposer(); } }, [modal]));
      return;
    }

    const state = existing ? JSON.parse(JSON.stringify(existing)) : {
      id: `manual-${Date.now()}`,
      platform: "instagram",
      media_type: "image",
      caption: "",
      status: "draft",
      scheduled_time: prefillDateKey ? parisInputsToIso(prefillDateKey, "17:30") : null,
    };
    const newFiles = { files: [] };

    function field(labelTxt, inputEl) { return el("div", { class: "field" }, [el("label", {}, [labelTxt]), inputEl]); }

    const captionInput = el("textarea", { placeholder: "Légende du post…" }, []);
    captionInput.value = state.caption || "";
    captionInput.addEventListener("input", () => state.caption = captionInput.value);

    const { date: initDate, time: initTime } = localInputsFromIso(state.scheduled_time);
    const dateInput = el("input", { type: "date" }); dateInput.value = initDate;
    const timeInput = el("input", { type: "time" }); timeInput.value = initTime || "17:30";

    const mediaTypeSelect = el("select", {}, [
      el("option", { value: "image" }, ["Image simple"]),
      el("option", { value: "carousel" }, ["Carrousel (2 à 10 images)"]),
      el("option", { value: "reel" }, ["Reel (vidéo)"]),
    ]);
    mediaTypeSelect.value = state.media_type || "image";

    const statusSelect = el("select", {}, [
      el("option", { value: "draft" }, ["Brouillon"]),
      el("option", { value: "pending" }, ["Programmé"]),
    ]);
    statusSelect.value = (state.status === "posted" || state.status === "error") ? "pending" : (state.status || "draft");

    const fileInput = el("input", { type: "file", multiple: "" });
    const filePreview = el("div", { class: "file-preview" });
    function refreshMediaAccept() {
      if (state.platform === "linkedin") { fileInput.accept = "image/*"; fileInput.removeAttribute("multiple"); }
      else if (mediaTypeSelect.value === "carousel") { fileInput.accept = "image/*"; fileInput.setAttribute("multiple", ""); }
      else if (mediaTypeSelect.value === "reel") { fileInput.accept = "video/*"; fileInput.removeAttribute("multiple"); }
      else { fileInput.accept = "image/*"; fileInput.removeAttribute("multiple"); }
    }
    function renderFilePreview() {
      filePreview.innerHTML = "";
      const canReorder = newFiles.files.length > 1;
      newFiles.files.forEach((f, idx) => {
        const url = URL.createObjectURL(f);
        const thumb = f.type.startsWith("video") ? el("video", { src: url, muted: "" }) : el("img", { src: url });
        const controls = [];
        if (canReorder && idx > 0) {
          controls.push(el("button", { type: "button", class: "file-preview-move", title: "Déplacer avant", onclick: () => {
            const t = newFiles.files[idx - 1]; newFiles.files[idx - 1] = newFiles.files[idx]; newFiles.files[idx] = t; renderFilePreview();
          } }, ["←"]));
        }
        if (canReorder && idx < newFiles.files.length - 1) {
          controls.push(el("button", { type: "button", class: "file-preview-move", title: "Déplacer après", onclick: () => {
            const t = newFiles.files[idx + 1]; newFiles.files[idx + 1] = newFiles.files[idx]; newFiles.files[idx] = t; renderFilePreview();
          } }, ["→"]));
        }
        controls.push(el("button", { type: "button", class: "file-preview-remove", title: "Retirer", onclick: () => {
          newFiles.files.splice(idx, 1); renderFilePreview();
        } }, ["×"]));
        filePreview.appendChild(el("div", { class: "file-preview-item" }, [thumb, el("div", { class: "file-preview-controls" }, controls)]));
      });
    }
    fileInput.addEventListener("change", () => {
      newFiles.files = Array.from(fileInput.files);
      renderFilePreview();
    });

    const mediaTypeField = field("Type de contenu (Instagram)", mediaTypeSelect);
    const fileField = field("Nouveau visuel (depuis ton Mac — laisser vide pour garder le visuel actuel)", (() => {
      const wrap = el("div", {}, [fileInput, filePreview]);
      return wrap;
    })());

    function currentMediaSummary() {
      const items = [];
      if (state.image_url) items.push({ type: "image", src: state.image_url });
      if (state.image_urls) state.image_urls.forEach(u => items.push({ type: "image", src: u }));
      if (state.video_url) items.push({ type: "video", src: state.video_url });
      if (items.length === 0) return null;
      const strip = el("div", { class: "current-media-preview" }, items.map(it =>
        it.type === "image"
          ? el("img", { src: it.src, loading: "lazy" })
          : el("video", { src: it.src, controls: "", muted: "", playsinline: "", preload: "metadata" })
      ));
      return field(items.length > 1 ? `Visuel actuel (${items.length} images)` : "Visuel actuel", strip);
    }

    const platformToggle = el("div", { class: "platform-toggle" }, [
      el("button", { class: `instagram${state.platform === "instagram" ? " active" : ""}`, onclick: () => { state.platform = "instagram"; rebuildMediaSection(); } }, ["Instagram"]),
      el("button", { class: `linkedin${state.platform === "linkedin" ? " active" : ""}`, onclick: () => { state.platform = "linkedin"; rebuildMediaSection(); } }, ["LinkedIn"]),
    ]);

    const mediaSectionRoot = el("div");
    function rebuildMediaSection() {
      platformToggle.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.classList.contains(state.platform)));
      mediaSectionRoot.innerHTML = "";
      if (state.platform === "instagram") mediaSectionRoot.appendChild(mediaTypeField);
      const summary = currentMediaSummary();
      if (summary) mediaSectionRoot.appendChild(summary);
      mediaSectionRoot.appendChild(fileField);
      refreshMediaAccept();
    }
    mediaTypeSelect.addEventListener("change", () => { state.media_type = mediaTypeSelect.value; refreshMediaAccept(); });

    const errBox = el("div");
    const errorBanner = (existing && existing.status === "error")
      ? el("div", { class: "status-msg err" }, [
          `Échec de la dernière tentative de publication : ${existing.error_message || "raison non précisée"}`,
        ])
      : null;

    const modal = el("div", { class: "modal" }, [
      el("h2", {}, [existing ? "Modifier le post" : "Nouveau post"]),
      errorBanner,
      errBox,
      field("Réseau", platformToggle),
      mediaSectionRoot,
      field("Légende", captionInput),
      el("div", { class: "field-row" }, [field("Date (heure de Paris)", dateInput), field("Heure (Paris)", timeInput)]),
      field("Statut", statusSelect),
      el("div", { class: "modal-actions" }, [
        existing ? el("button", { class: "btn btn-danger", onclick: async () => {
          if (!confirm("Supprimer définitivement ce post ?")) return;
          try {
            await commitScheduleChange(fresh => fresh.filter(p => p.id !== existing.id), `suppression: ${existing.id}`);
            closeComposer(); switchTab(currentTab);
          }
          catch (e) { errBox.appendChild(el("div", { class: "status-msg err" }, [String(e.message || e)])); }
        } }, ["Supprimer"]) : el("span"),
        el("div", { class: "modal-actions-right" }, [
          el("button", { class: "btn btn-secondary", onclick: closeComposer }, ["Annuler"]),
          el("button", { class: "btn btn-primary", id: "composer-save", onclick: async () => {
            errBox.innerHTML = "";
            state.caption = captionInput.value;
            state.status = statusSelect.value;
            state.scheduled_time = parisInputsToIso(dateInput.value, timeInput.value);
            if (!state.scheduled_time) { errBox.appendChild(el("div", { class: "status-msg err" }, ["Date et heure requises."])); return; }
            if (state.platform === "instagram") state.media_type = mediaTypeSelect.value; else delete state.media_type;

            const hasExistingMedia = !!(state.image_url || (state.image_urls && state.image_urls.length) || state.video_url);
            const hasNewFiles = newFiles.files.length > 0;
            if (state.platform === "instagram" && state.status === "pending" && !hasExistingMedia && !hasNewFiles) {
              errBox.appendChild(el("div", { class: "status-msg err" }, ["Un post Instagram programmé doit avoir un visuel — ajoute une image/vidéo, ou repasse-le en brouillon."]));
              return;
            }

            try {
              if (newFiles.files.length > 0) {
                errBox.appendChild(el("div", { class: "status-msg busy", id: "upload-status" }, [`Envoi de ${newFiles.files.length} fichier(s)…`]));
                const folder = (dateInput.value || "divers").slice(0, 7);
                if (state.platform === "instagram" && state.media_type === "carousel") {
                  if (newFiles.files.length < 2 || newFiles.files.length > 10) throw new Error(`Un carrousel accepte de 2 à 10 images (${newFiles.files.length} fournies).`);
                  delete state.image_url; delete state.video_url;
                  state.image_urls = [];
                  for (const f of newFiles.files) state.image_urls.push(await uploadMedia(f, folder));
                } else if (state.platform === "instagram" && state.media_type === "reel") {
                  delete state.image_url; delete state.image_urls;
                  state.video_url = await uploadMedia(newFiles.files[0], folder);
                } else {
                  delete state.image_urls; delete state.video_url;
                  state.image_url = await uploadMedia(newFiles.files[0], folder);
                }
              }
              await commitScheduleChange(fresh => {
                const idx = fresh.findIndex(p => p.id === state.id);
                const copy = fresh.slice();
                if (idx >= 0) copy[idx] = state; else copy.push(state);
                return copy;
              }, existing ? `modification: ${state.id}` : `nouveau post: ${state.id}`);
              closeComposer();
              switchTab(currentTab);
            } catch (e) {
              errBox.innerHTML = "";
              errBox.appendChild(el("div", { class: "status-msg err" }, [String(e.message || e)]));
            }
          } }, [existing ? "Enregistrer" : "Créer"]),
        ]),
      ]),
    ]);
    root.appendChild(el("div", { class: "overlay", onclick: (e) => { if (e.target === e.currentTarget) closeComposer(); } }, [modal]));
    rebuildMediaSection();
  }

  // ---------- boot ----------
  async function boot() {
    document.getElementById("btn-refresh").addEventListener("click", async () => {
      try { await loadSchedule(); switchTab(currentTab); } catch (e) { setStatus(String(e.message || e), "err"); }
    });
    document.getElementById("btn-new").addEventListener("click", () => openComposer(null));
    document.getElementById("btn-settings").addEventListener("click", () => {
      if (confirm("Effacer le jeton GitHub enregistré dans ce navigateur ?")) { localStorage.removeItem("karicool_pat"); location.reload(); }
    });
    document.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));

    try {
      await loadSchedule();
      switchTab("calendar");
    } catch (e) {
      setStatus(`${e.message || e}`, "err");
    }
  }

  function tryGate() {
    const saved = localStorage.getItem("karicool_pat");
    if (saved) {
      PAT = saved;
      document.getElementById("app").hidden = false;
      boot();
      return;
    }
    document.getElementById("gate").hidden = false;
    document.getElementById("gate-save").addEventListener("click", async () => {
      const val = document.getElementById("gate-pat").value.trim();
      if (!val) return;
      PAT = val;
      const r = await fetch(`${API}/repos/${OWNER}/${REPO_SCHEDULE}/contents/schedule.json`, { headers: ghHeaders() });
      if (!r.ok) {
        document.getElementById("gate-error").textContent = "Ce jeton ne fonctionne pas (vérifie qu'il a accès en lecture/écriture aux dépôts karicool et karicool-media).";
        return;
      }
      localStorage.setItem("karicool_pat", val);
      document.getElementById("gate").hidden = true;
      document.getElementById("app").hidden = false;
      boot();
    });
  }

  tryGate();
})();
</script>
</body>
</html>
